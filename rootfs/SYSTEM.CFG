; Matrix16 system configuration
;
; Each TASK statement controls one of the five configured task slots. A task
; has exactly one source and may optionally name its console. If CONSOLE is
; omitted, slots 0-3 use VC0-VC3 and slot 4 uses COM1.
;
; SUPERA and SUPERB select the matching task pointer from the superblock on
; drive A or B. They can only be used for TASK0 through TASK3. A:filename and
; B:filename load a named task file. NONE leaves a slot empty.
;
; The built-in setup restores slots 0-3 from SUPERA and leaves slot 4 unused.
; An explicit TASK statement replaces the built-in source for that slot.
; ERROR controls what happens if a task source cannot be loaded. DEFAULT
; silently performs DEFAULT=, REPORT reports the error, NONE silently skips
; the task, SHELL loads the configured shell, and a filename loads that task.
; A filename without A: or B: is read from drive A.

SHELL=SHELL.TSK
DEFAULT=SHELL
ERROR=DEFAULT
STARTDELAY=25
FILES=8
;TASK0=SUPERA,CONSOLE=VC0
TASK0=SAVED.TSK,CONSOLE=VC0
TASK1=SUPERA,CONSOLE=VC1
TASK2=SUPERA,CONSOLE=VC2
TASK3=SUPERA,CONSOLE=VC3
TASK4=NONE

; STARTDELAY is the number of BIOS timer ticks to wait before starting tasks.
; The standard BIOS timer runs at about 18.2 ticks per second, so 55 ticks is
; approximately three seconds. Set STARTDELAY=0 to start immediately.
; FILES is the number of file handles available to the kernel.
;
; The standard setup restores slots 0-3 from drive A's superblock. If a saved
; task cannot be loaded, ERROR=DEFAULT silently loads SHELL.TSK instead.
;
; Example: start four named tasks from the boot floppy.
;
; TASK0=A:SHELL.TSK,CONSOLE=VC0
; TASK1=A:EDITOR.TSK,CONSOLE=VC1
; TASK2=A:BASIC.TSK,CONSOLE=VC2
; TASK3=A:DEBUG.TSK,CONSOLE=VC3
; TASK4=NONE
;
; Example: restore tasks 1 and 2 from the floppy in drive B, while loading a
; fresh shell from drive A. A task statement has only one source, so failure
; leaves that slot empty.
;
; TASK0=A:SHELL.TSK,CONSOLE=VC0
; TASK1=SUPERB,CONSOLE=VC1
; TASK2=SUPERB,CONSOLE=VC2
; TASK3=NONE
; TASK4=NONE
;
; Example reserved for future serial-console support. COM1 and COM2 are valid
; configuration names, but the current kernel reports an error and ignores a
; task assigned to either one.
;
; TASK0=SUPERA,CONSOLE=VC0
; TASK1=NONE
; TASK2=NONE
; TASK3=NONE
; TASK4=A:REMOTE.TSK,CONSOLE=COM1
